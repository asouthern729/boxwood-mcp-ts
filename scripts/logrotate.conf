# Installed as /etc/logrotate.d/boxwood-mcp (run daily by the system's cron.daily logrotate):
#   sudo install -m 644 -o root -g root scripts/logrotate.conf /etc/logrotate.d/boxwood-mcp
# Re-run that after editing this file.
#
# The pm2 logs (access/error, both apps) and the cron job logs under /var/log/boxwood-mcp/<job>/.
# Not /var/log/boxwood-mcp/syncs: the AMS360 ETL rotates its own (~/scripts/ams360-etl/logrotate.conf).
# A new cron job's log directory needs adding here.
#
# su: the directories are owned by andrew and group-writable, which root logrotate refuses without it.
# copytruncate: pm2 keeps its log files open; the cron jobs append and close, so it's harmless there.

/var/log/boxwood-mcp/access/*.log
/var/log/boxwood-mcp/error/*.log
/var/log/boxwood-tools/access/*.log
/var/log/boxwood-tools/error/*.log
/var/log/boxwood-mcp/morning-download/*.log
/var/log/boxwood-mcp/cl-renewal-summaries/*.log
/var/log/boxwood-mcp/pl-premium-change/*.log
/var/log/boxwood-mcp/pl-renewal-summary/*.log
/var/log/boxwood-mcp/renewal-premium-summaries/*.log
/var/log/boxwood-mcp/risk-profiles/*.log
{
    su andrew andrew
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    dateext
    copytruncate
}
