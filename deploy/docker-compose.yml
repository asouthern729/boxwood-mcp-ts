services:
  boxwood-mcp:
    image: ghcr.io/asouthern729/boxwood-mcp-ts:1.0.5
    restart: unless-stopped
    network_mode: host
    environment:
      HOST: 127.0.0.1
      HOME: /tmp
      PGHOST: ${PGHOST}
      PGPORT: ${PGPORT}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      PORT: ${PORT}

      AUTH0_TENANT_DOMAIN: ${AUTH0_TENANT_DOMAIN}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET}
      AUTH0_API_URI: ${AUTH0_API_URI}

      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_FROM: ${MAIL_FROM}
      ALERT_TO: ${ALERT_TO}

      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

      OUTPUT_ROOT: /var/lib/boxwood-mcp/output
      STATE_ROOT: /var/lib/boxwood-mcp/state
    user: "node"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./data/output:/var/lib/boxwood-mcp/output
      - ./data/state:/var/lib/boxwood-mcp/state
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
  # Scheduler: supercronic runs cron/crontab (baked into the image) and each job writes its log to
  # the host's /var/log/boxwood-mcp. Own memory limit so a LibreOffice-heavy build can't starve the
  # web server; the three 09:00 jobs run at the same time, hence 2g.
  jobs:
    image: ghcr.io/asouthern729/boxwood-mcp-ts:1.0.5
    restart: unless-stopped
    command: ["supercronic", "/app/cron/crontab"]
    network_mode: host
    environment:
      HOME: /tmp
      PGHOST: ${PGHOST}
      PGPORT: ${PGPORT}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}

      AUTH0_TENANT_DOMAIN: ${AUTH0_TENANT_DOMAIN}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET}
      AUTH0_API_URI: ${AUTH0_API_URI}

      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_FROM: ${MAIL_FROM}
      ALERT_TO: ${ALERT_TO}

      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

      OUTPUT_ROOT: /var/lib/boxwood-mcp/output
      STATE_ROOT: /var/lib/boxwood-mcp/state
    user: "node"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./data/output:/var/lib/boxwood-mcp/output
      - ./data/state:/var/lib/boxwood-mcp/state
      - /var/log/boxwood-mcp:/var/log/boxwood-mcp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
